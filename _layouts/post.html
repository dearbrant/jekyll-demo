---
layout: default
bodyClass: "page-post"
---

<div class="container pb-6 pt-4 pb-md-10">
  <div class="row justify-content-start">
    <article class="col-12 col-md-8">
      <header>
        <h1 class="title">{{ page.title | escape }}</h1>
        <p class="post-meta">
          <time datetime="{{ page.date | date: '%Y-%m' }}">{% if page.lang == 'zh-CN' %}{{ page.date | date: '%Y 年 %-m 月' }}{% else %}{{ page.date | date: '%B %Y' }}{% endif %}</time>
        </p>
      </header>
      <div class="content">{{ content }}</div>
      <p class="mt-4"><a href="{% if page.lang == 'en' %}{{ '/en/tutorials/' | relative_url }}{% else %}{{ '/tutorials/' | relative_url }}{% endif %}">{% if page.lang == 'zh-CN' %}返回博客{% else %}Back to Tutorials{% endif %}</a></p>
    </article>
  </div>
</div>
